quarkus.application.name=notearray

# PostgreSQL — override via environment variables in production:
#   NOTEARRAY_DB_URL, NOTEARRAY_DB_USERNAME, NOTEARRAY_DB_PASSWORD
# Without a profile prefix these examples only apply to non-prod profiles
# (local dev). The %prod overrides below have NO defaults: a packaged jar
# (prod profile) refuses to start unless all three variables are set.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${NOTEARRAY_DB_URL:jdbc:postgresql://localhost:5432/bob}
quarkus.datasource.username=${NOTEARRAY_DB_USERNAME:bob}
quarkus.datasource.password=${NOTEARRAY_DB_PASSWORD:bob}
%prod.quarkus.datasource.jdbc.url=${NOTEARRAY_DB_URL}
%prod.quarkus.datasource.username=${NOTEARRAY_DB_USERNAME}
%prod.quarkus.datasource.password=${NOTEARRAY_DB_PASSWORD}

# Schema is managed by Flyway (src/main/resources/db/migration)
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# Maximum request body size (allows 10 MB attachments and 50 MB Joplin JEX imports)
quarkus.http.limits.max-body-size=55M

# Security headers for all HTTP responses (including static assets at / and /assets/*)
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin
quarkus.http.header."Permissions-Policy".value=camera=(), microphone=(), geolocation=(), payment=()
%prod.quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains; preload

# Access log: host, request, status, bytes, response time and the X-Request-Id
# emitted by SecurityHeadersFilter (generated when the caller sends none).
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %t "%r" %s %b %D %{o,X-Request-Id}

# Sessions are stored (SHA-256 hashed) in the sessions table; add the Secure attribute behind TLS in production.
%prod.notearray.session.cookie-secure=true

# OpenAPI / Swagger UI / Metrics (enabled in dev; disabled in prod by default)
# Spec:       GET /q/openapi            (YAML)  or /q/openapi?format=json
# Swagger UI: /q/swagger-ui
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=NoteArray API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=CRUD API for NoteArray users and text notes
quarkus.swagger-ui.path=/q/swagger-ui
%prod.quarkus.swagger-ui.enable=false
%prod.quarkus.smallrye-openapi.enable=false
%prod.quarkus.micrometer.export.prometheus.enabled=false

# Logging — INFO by default. Only the dev profile gets DEBUG logs for app
# code; production must not log request payloads or SQL at DEBUG.
quarkus.log.level=INFO
%dev.quarkus.log.category."com.notearray".level=DEBUG

# Throttling for the login and signup endpoints (see LoginThrottleService).
# Hourly request budgets per client IP; failed logins additionally back off 1s, 2s,
# 4s ... per account, with a 15 minute lockout after 8 consecutive failures.
notearray.rate-limit.login-per-hour-per-ip=120
notearray.rate-limit.signup-per-hour-per-ip=30
# Trust X-Forwarded-For for the client IP. Enable ONLY behind a reverse proxy that
# overwrites the header; otherwise clients can spoof it and bypass the IP budgets.
notearray.rate-limit.trust-proxy=false

# Dev: log SQL
%dev.quarkus.hibernate-orm.log.sql=true
